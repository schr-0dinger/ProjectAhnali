name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check runtime ABI snapshot
        run: PYTHONPATH=. python tools/runtime_abi_snapshot.py --check --out cfg/runtime_abi_snapshot_v1.json

      - name: Check reactive surface snapshot
        run: PYTHONPATH=. python tools/reactive_surface_snapshot.py --check --out cfg/reactive_surface_snapshot_v1.json

      - name: Check v1 scope matrix
        run: PYTHONPATH=. python tools/v1_scope_matrix.py --check --masterplan Masterplan_All_In_One.md --matrix cfg/v1_scope_matrix.yaml

      - name: Check capability mapping contract
        run: PYTHONPATH=. python tools/capability_mapping_contract.py --check --out cfg/capability_mapping_snapshot_v1.json --doc docs/capability_runtime_mapping_v1.md

      - name: Check docs consistency
        run: PYTHONPATH=. python tools/docs_consistency.py --masterplan Masterplan_All_In_One.md --readme README.md --runtime-abi runtime_abi_v1.md --capability-doc docs/capability_runtime_mapping_v1.md --program6b-doc docs/Program6B_Task_Breakdown.md

      - name: Check Python library policy
        run: PYTHONPATH=. python tools/python_library_policy.py --policy cfg/python_library_policy.json

      - name: Run test suite
        run: PYTHONPATH=. pytest -q -rs

  benchmark-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download smali toolchain jars
        run: |
          set -euo pipefail
          mkdir -p /tmp/smali-lib
          base="https://repo1.maven.org/maven2"
          for rel in \
            org/smali/smali/2.5.2/smali-2.5.2.jar \
            org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar \
            org/smali/util/2.5.2/util-2.5.2.jar \
            org/antlr/antlr/3.5.2/antlr-3.5.2.jar \
            org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar \
            org/antlr/stringtemplate/3.2.1/stringtemplate-3.2.1.jar \
            com/beust/jcommander/1.64/jcommander-1.64.jar \
            com/google/guava/guava/27.1-android/guava-27.1-android.jar \
            com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar \
            com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar \
            com/google/guava/listenablefuture/9999.0-empty-to-avoid-conflict-with-guava/listenablefuture-9999.0-empty-to-avoid-conflict-with-guava.jar \
            org/checkerframework/checker-compat-qual/2.5.2/checker-compat-qual-2.5.2.jar \
            com/google/errorprone/error_prone_annotations/2.2.0/error_prone_annotations-2.2.0.jar \
            com/google/j2objc/j2objc-annotations/1.1/j2objc-annotations-1.1.jar \
            org/codehaus/mojo/animal-sniffer-annotations/1.17/animal-sniffer-annotations-1.17.jar
          do
            curl -fsSL -o "/tmp/smali-lib/$(basename "$rel")" "$base/$rel"
          done

      - name: Run APK size benchmark gate
        env:
          SMALI_JAR: /tmp/smali-lib/smali-2.5.2.jar
        run: |
          PYTHONPATH=. python tools/benchmark_apk.py \
            --threshold-file cfg/benchmark_thresholds.json \
            --baseline-file cfg/benchmark_baseline.json \
            --report-file build/benchmark/size_report.json \
            --api 34 \
            --skip-cold-start

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-size-report
          path: build/benchmark/

  benchmark-cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - benchmark-size
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "system-images;android-30;google_apis;x86_64"

      - name: Download smali toolchain jars
        run: |
          set -euo pipefail
          mkdir -p /tmp/smali-lib
          base="https://repo1.maven.org/maven2"
          for rel in \
            org/smali/smali/2.5.2/smali-2.5.2.jar \
            org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar \
            org/smali/util/2.5.2/util-2.5.2.jar \
            org/antlr/antlr/3.5.2/antlr-3.5.2.jar \
            org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar \
            org/antlr/stringtemplate/3.2.1/stringtemplate-3.2.1.jar \
            com/beust/jcommander/1.64/jcommander-1.64.jar \
            com/google/guava/guava/27.1-android/guava-27.1-android.jar \
            com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar \
            com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar \
            com/google/guava/listenablefuture/9999.0-empty-to-avoid-conflict-with-guava/listenablefuture-9999.0-empty-to-avoid-conflict-with-guava.jar \
            org/checkerframework/checker-compat-qual/2.5.2/checker-compat-qual-2.5.2.jar \
            com/google/errorprone/error_prone_annotations/2.2.0/error_prone_annotations-2.2.0.jar \
            com/google/j2objc/j2objc-annotations/1.1/j2objc-annotations-1.1.jar \
            org/codehaus/mojo/animal-sniffer-annotations/1.17/animal-sniffer-annotations-1.17.jar
          do
            curl -fsSL -o "/tmp/smali-lib/$(basename "$rel")" "$base/$rel"
          done

      - name: Run cold-start benchmark gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            PYTHONPATH=. SMALI_JAR=/tmp/smali-lib/smali-2.5.2.jar python tools/benchmark_apk.py \
              --threshold-file cfg/benchmark_thresholds.json \
              --baseline-file cfg/benchmark_baseline.json \
              --report-file build/benchmark/cold_start_report.json \
              --api 34 \
              --require-cold-start \
              --cold-start-iterations 3

      - name: Upload cold-start artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-cold-start-report
          path: build/benchmark/
